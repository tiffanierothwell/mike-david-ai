<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,600;0,700;0,800;0,900;1,200;1,300&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #050505;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 64px 72px;
    background:
      radial-gradient(ellipse at top right, rgba(255,255,255,0.06), transparent 55%),
      radial-gradient(ellipse at bottom left, rgba(255,255,255,0.03), transparent 60%),
      linear-gradient(180deg, #131313 0%, #050505 100%);
    overflow: hidden;
  }
  /* Dot pattern in top-right */
  .card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 540px;
    height: 540px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.10) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    mask-image: linear-gradient(225deg, rgba(0,0,0,0.85), transparent 65%);
    -webkit-mask-image: linear-gradient(225deg, rgba(0,0,0,0.85), transparent 65%);
    pointer-events: none;
  }
  /* Top accent line */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #fff 0%, #fff 280px, rgba(255,255,255,0.18) 280px, transparent 100%);
  }

  /* Top bar — eyebrow + Little Tree mark */
  .top {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
  }
  .eyebrow {
    font-size: 14px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .eyebrow .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 14px rgba(255,255,255,0.7);
  }
  .mark {
    width: 60px;
    height: 60px;
    opacity: 0.95;
  }

  /* Title */
  .title {
    position: relative;
    z-index: 2;
    font-size: 84px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    line-height: 0.96;
    background: linear-gradient(180deg, #ffffff 0%, #d6d6d6 50%, #8a8a8a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 26px;
    max-width: 1060px;
  }
  .title em {
    font-style: normal;
    color: rgba(255,255,255,0.42);
    -webkit-text-fill-color: rgba(255,255,255,0.42);
  }

  /* Subtitle */
  .sub {
    position: relative;
    z-index: 2;
    font-size: 21px;
    color: rgba(255,255,255,0.62);
    line-height: 1.5;
    font-weight: 400;
    max-width: 680px;
  }
  .sub strong { color: #fff; font-weight: 600; }

  /* Bottom row */
  .bottom {
    position: absolute;
    z-index: 2;
    bottom: 56px;
    left: 72px;
    right: 72px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-top: 26px;
    border-top: 1px solid rgba(255,255,255,0.10);
  }
  .author {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .author-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
  }
  .author-role {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    font-weight: 600;
  }
  .quote {
    font-style: italic;
    font-weight: 300;
    font-size: 30px;
    color: #fff;
    letter-spacing: -0.018em;
    text-align: right;
    line-height: 1;
  }
  .quote em {
    font-style: italic;
    color: rgba(255,255,255,0.45);
  }
  .url {
    position: absolute;
    bottom: 8px;
    right: 72px;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.35);
    font-weight: 700;
    text-transform: uppercase;
  }
</style>
</head>

</html>
